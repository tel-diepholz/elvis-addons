worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  default_type application/octet-stream;
  server {
    listen @PORT@;
    # Abbild und Installer-squashfs aus dem Volume
    location /images/ { alias /data/images/; autoindex off; }
    # Kernel/initrd zusätzlich per HTTP (lpxelinux lädt schneller als über TFTP)
    location /tftp/installer/ { alias /srv/tftp/installer/; }
    location = /config/installer.env { alias /srv/config/installer.env; default_type text/plain; }
    location / { return 404; }
  }
}
