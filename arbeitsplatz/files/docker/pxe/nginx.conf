worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  default_type application/octet-stream;
  server {
    listen @PORT@;
    # Abbild und Installer-squashfs aus dem Volume
    location /images/ { alias /data/images/; autoindex off; }
    # Kernel/initrd zusätzlich per HTTP (lpxelinux lädt schneller als über TFTP)
    location /tftp/installer/ { alias /srv/tftp/installer/; }
    # Installer-Skript in der Fassung des Addons (das Live-System holt sich die aktuelle beim Start)
    location = /installer/elvis-install { alias /data/addon/installer/elvis-install; default_type text/plain; }
    # Dateien des Client-Systems für post-install.sh (Korrekturen ohne neuen Bau)
    location /client/ { alias /data/addon/client/; }
    # Installer-ISO (vom Container beim Start mit seiner Adresse erzeugt)
    location = /iso/elvis-installer.iso {
      alias /srv/iso/elvis-installer.iso;
      add_header Content-Disposition 'attachment; filename="elvis-installer.iso"';
    }
    location = /config/installer.env { alias /srv/config/installer.env; default_type text/plain; }
    location / { return 404; }
  }
}
