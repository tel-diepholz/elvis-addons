# Lokaler Kartenserver: erzeugt aus OpenStreetMap-Daten eigene Kacheln (Planetiler) und liefert sie
# in drei Stilen aus (tileserver-gl): Standard, Dunkel, Druck. Vollständig offline nutzbar.
id: kartenserver
name: Kartenserver
version: 1.1.1
description: >-
  Eigene Karten aus OpenStreetMap für die gewählten Regionen – offline, in den Stilen Standard,
  Dunkel (für den Nachtbetrieb) und Druck (schwarz-weiß, Refill-ähnlich). Aktualisiert sich auf Wunsch
  automatisch. Erstbefüllung je nach Region einige Minuten bis über eine Stunde.
icon: map
url: https://github.com/maptiler/tileserver-gl
arch: [amd64, arm64]

options:
  regions:
    type: multiselect
    label: Regionen
    help: OSM-Auszüge von Geofabrik. Je mehr Regionen, desto länger dauert die Erzeugung.
    required: true
    default: [germany/thueringen]
    choices:
      - { value: germany, label: Deutschland (gesamt, ca. 4,9 GB) }
      - { value: germany/baden-wuerttemberg, label: Baden-Württemberg }
      - { value: germany/bayern, label: Bayern }
      - { value: germany/berlin, label: Berlin }
      - { value: germany/brandenburg, label: Brandenburg }
      - { value: germany/bremen, label: Bremen }
      - { value: germany/hamburg, label: Hamburg }
      - { value: germany/hessen, label: Hessen }
      - { value: germany/mecklenburg-vorpommern, label: Mecklenburg-Vorpommern }
      - { value: germany/niedersachsen, label: Niedersachsen }
      - { value: germany/nordrhein-westfalen, label: Nordrhein-Westfalen }
      - { value: germany/rheinland-pfalz, label: Rheinland-Pfalz }
      - { value: germany/saarland, label: Saarland }
      - { value: germany/sachsen, label: Sachsen }
      - { value: germany/sachsen-anhalt, label: Sachsen-Anhalt }
      - { value: germany/schleswig-holstein, label: Schleswig-Holstein }
      - { value: germany/thueringen, label: Thüringen }
      - { value: austria, label: Österreich }
      - { value: switzerland, label: Schweiz }
      - { value: netherlands, label: Niederlande }
      - { value: belgium, label: Belgien }
      - { value: luxembourg, label: Luxemburg }
      - { value: france, label: Frankreich }
      - { value: poland, label: Polen }
      - { value: czech-republic, label: Tschechien }
      - { value: denmark, label: Dänemark }
  updateInterval:
    type: select
    label: Automatische Aktualisierung
    default: weekly
    choices:
      - { value: never, label: Nie (nur manuell) }
      - { value: daily, label: Täglich }
      - { value: weekly, label: Wöchentlich }
      - { value: monthly, label: Monatlich }
  updateHour:
    type: int
    label: Uhrzeit der Aktualisierung (Stunde)
    help: Am besten nachts, die Erzeugung belastet den Server.
    default: 3
    min: 0
    max: 23
  memory:
    type: select
    label: Arbeitsspeicher für die Kartenerzeugung
    help: Etwa die halbe Größe der OSM-Daten, mindestens 2 GB. Deutschland gesamt braucht 8 GB oder mehr.
    default: 4g
    choices:
      - { value: 2g, label: 2 GB }
      - { value: 4g, label: 4 GB }
      - { value: 8g, label: 8 GB }
      - { value: 16g, label: 16 GB }
      - { value: 32g, label: 32 GB }
  port:
    type: int
    label: Port auf dem Host
    default: 8081
    min: 1024
    max: 65535

files:
  volume: data
  target: /addon
  paths:
    - scripts/assets.sh
    - scripts/download.sh
    - scripts/sources.sh
    - scripts/activate.sh
    - styles/druck.json

containers:
  - name: server
    image: maptiler/tileserver-gl:v5.6.0
    command: ["--config", "/data/config.json"]
    ports:
      - container: 8080
        host: "{{options.port}}"
    volumes:
      - { name: data, target: /data }
    # Ohne erzeugte Kacheln würde der Server nicht starten
    waitForJob: update

jobs:
  update:
    label: Kartendaten aktualisieren
    description: Stile laden, OSM-Daten der Regionen laden, Kacheln erzeugen und aktivieren.
    runOnInstall: true
    restartAfter: true
    schedule:
      interval: "{{options.updateInterval}}"
      hour: "{{options.updateHour}}"
    steps:
      - label: Stile und Schriften
        image: alpine:3.20
        command: ["sh", "/data/addon/scripts/assets.sh"]
        volumes:
          - { name: data, target: /data }
        weight: 1
      - label: Zusatzdaten laden
        image: alpine:3.20
        command: ["sh", "/data/addon/scripts/sources.sh"]
        volumes:
          - { name: data, target: /data }
        weight: 2
      - label: OSM-Daten laden
        image: debian:bookworm-slim
        command: ["sh", "/data/addon/scripts/download.sh"]
        env:
          REGIONS: "{{options.regions}}"
        volumes:
          - { name: data, target: /data }
        weight: 3
      - label: Kacheln erzeugen
        image: ghcr.io/onthegomap/planetiler:0.10.2
        # Zusatzdaten liegen schon bereit (Schritt „Zusatzdaten laden“); Planetiler lädt nichts selbst.
        command:
          - --osm-path=/data/work/input.osm.pbf
          - --water-polygons-path=/data/sources/water-polygons-split-3857.zip
          - --natural-earth-path=/data/sources/natural_earth_vector.sqlite.zip
          - --lake-centerlines-path=/data/sources/lake_centerline.shp.zip
          - --download=false
          - --download-osm-tile-weights=false
          - --tmpdir=/data/tmp
          - --output=/data/work/osm.mbtiles
          - --force
        env:
          JAVA_TOOL_OPTIONS: "-Xmx{{options.memory}}"
        volumes:
          - { name: data, target: /data }
        weight: 8
        # Planetiler meldet seine Phasen in eckigen Klammern; Prozentangaben verfeinern innerhalb der Phase.
        progress:
          inlinePercent: true
          phases:
            - { match: "\\[(lake_centerlines|wikidata)", percent: 1, label: Seenbeschriftung }
            - { match: "\\[water_polygons", percent: 3, label: Wasserflächen }
            - { match: "\\[natural_earth", percent: 6, label: Natural Earth }
            - { match: "\\[osm_pass1", percent: 10, label: OSM lesen (Durchgang 1) }
            - { match: "\\[osm_pass2", percent: 30, label: OSM verarbeiten (Durchgang 2) }
            - { match: "\\[boundaries", percent: 68, label: Grenzen }
            - { match: "\\[sort", percent: 72, label: Sortieren }
            - { match: "\\[(mbtiles|archive)", percent: 78, label: Kacheln schreiben }
      - label: Neue Daten aktivieren
        image: alpine:3.20
        command: ["sh", "/data/addon/scripts/activate.sh"]
        volumes:
          - { name: data, target: /data }
        weight: 0.2

provides:
  mapSources:
    - id: standard
      name: Lokale Karte
      url: "http://{{host.address}}:{{options.port}}/styles/standard/{z}/{x}/{y}{r}.png"
      attribution: © OpenMapTiles © OpenStreetMap-Mitwirkende
      maxZoom: 19
      pixelRatio: 2
      variant: light
    - id: dunkel
      name: Lokale Karte (dunkel)
      url: "http://{{host.address}}:{{options.port}}/styles/dunkel/{z}/{x}/{y}{r}.png"
      attribution: © OpenMapTiles © OpenStreetMap-Mitwirkende
      maxZoom: 19
      pixelRatio: 2
      variant: dark
    - id: druck
      name: Lokale Karte (Druck, schwarz-weiß)
      url: "http://{{host.address}}:{{options.port}}/styles/druck/{z}/{x}/{y}{r}.png"
      attribution: © OpenMapTiles © OpenStreetMap-Mitwirkende
      maxZoom: 19
      pixelRatio: 2
      variant: print
