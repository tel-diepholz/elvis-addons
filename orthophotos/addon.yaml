id: orthophotos
name: Luftbilder (Orthophotos)
version: 2.0.0
description: Zeigt die Abdeckung der digitalen Orthophotos auf einer Karte. Einzelne Luftbilder lassen sich auswählen, werden geladen, in lokale XYZ-Kacheln umgewandelt und erscheinen in ELVIS im Kartenstil „Luftbild (lokal)“. Vorerst Niedersachsen (LGLN, DOP20).
arch: [amd64, arm64]
options:
  minZoom: { type: int, label: Kleinste Zoomstufe, default: 12, min: 8, max: 18, help: Darunter bleibt der Kartenstil leer. Kleine Werte machen das Zusammensetzen der Kacheln langsamer. }
  maxZoom: { type: int, label: Größte Zoomstufe, default: 19, min: 14, max: 20, help: "DOP20 (20 cm) entspricht etwa Stufe 19. Jede Stufe vervierfacht den Speicherbedarf." }
  processes: { type: int, label: Prozesse beim Umwandeln, default: 2, min: 1, max: 16 }
  port: { type: int, label: Port auf dem Host, default: 8091, min: 1024, max: 65535 }
containers:
  - name: server
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.9.2
    command: [python3, /data/addon/server/app.py]
    env:
      MIN_ZOOM: "{{options.minZoom}}"
      MAX_ZOOM: "{{options.maxZoom}}"
      PROCESSES: "{{options.processes}}"
    ports: [{ container: 8080, host: "{{options.port}}" }]
    volumes: [{ name: data, target: /data }]
files:
  volume: data
  target: /addon
  paths:
    - server/app.py
    - server/sources.py
    - ui/index.html
    - ui/app.js
    - ui/style.css
    - ui/leaflet/leaflet.js
    - ui/leaflet/leaflet.css
provides:
  mapSources:
    - id: luftbild
      name: Luftbild (lokal)
      url: "http://{{host.address}}:{{options.port}}/tiles/{z}/{x}/{y}.png"
      attribution: "Orthophotos: © LGLN (CC BY 4.0)"
      maxZoom: 20
  ui:
    name: Luftbilder auswählen
    url: "http://{{host.address}}:{{options.port}}/"
