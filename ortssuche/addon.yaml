# Ortssuche für die Karte ohne Internet: Nominatim (https://nominatim.org) mit eigenen OSM-Daten von Geofabrik.
# Liefert Suche, Adressen und Umrisse von Orten. ELVIS bevorzugt diesen Dienst vor den öffentlichen, sobald er läuft;
# findet er nichts (z. B. halb getippte Wörter), versucht es ELVIS online bei photon.komoot.io.
id: ortssuche
name: Ortssuche
version: 1.0.0
description: >-
  Straßen, Orte, Adressen und Ortsumrisse in der Karte suchen – offline. Importiert einmalig die
  OSM-Daten der gewählten Region in eine eigene Datenbank (Deutschland: etwa 100 GB Speicher und je nach
  Hardware 8–12 Stunden) und hält sie danach über die Replikation von Geofabrik aktuell, sobald Internet da ist.
icon: search
url: https://github.com/mediagis/nominatim-docker
arch: [amd64, arm64]

options:
  region:
    type: select
    label: Region
    help: OSM-Auszug von Geofabrik. Nach der Installation nicht mehr änderbar (Neuinstallation nötig).
    default: germany
    choices:
      - { value: germany, label: Deutschland (ca. 4,5 GB OSM-Daten) }
      - { value: germany/baden-wuerttemberg, label: Baden-Württemberg }
      - { value: germany/bayern, label: Bayern }
      - { value: germany/berlin, label: Berlin }
      - { value: germany/brandenburg, label: Brandenburg }
      - { value: germany/bremen, label: Bremen }
      - { value: germany/hamburg, label: Hamburg }
      - { value: germany/hessen, label: Hessen }
      - { value: germany/mecklenburg-vorpommern, label: Mecklenburg-Vorpommern }
      - { value: germany/niedersachsen, label: Niedersachsen }
      - { value: germany/nordrhein-westfalen, label: Nordrhein-Westfalen }
      - { value: germany/rheinland-pfalz, label: Rheinland-Pfalz }
      - { value: germany/saarland, label: Saarland }
      - { value: germany/sachsen, label: Sachsen }
      - { value: germany/sachsen-anhalt, label: Sachsen-Anhalt }
      - { value: germany/schleswig-holstein, label: Schleswig-Holstein }
      - { value: germany/thueringen, label: Thüringen }
  importStyle:
    type: select
    label: Umfang
    help: >-
      „Alles“ findet auch Schulen, Feuerwehrhäuser, Firmen und andere Sonderorte. „Adressen“ braucht deutlich
      weniger Speicher.
    default: full
    choices:
      - { value: full, label: Alles (Adressen und Sonderorte) }
      - { value: address, label: Adressen (Straßen, Hausnummern, Orte) }
  updates:
    type: select
    label: Aktualisierung
    help: Lädt nur Änderungen (Replikation). Ohne Internet pausiert sie und holt beim nächsten Start nach.
    default: continuous
    choices:
      - { value: continuous, label: Laufend, sobald Internet da ist }
      - { value: catch-up, label: Beim Start des Dienstes }
      - { value: none, label: Nie }
  memory:
    type: select
    label: Arbeitsspeicher der Datenbank
    help: Etwa ein Viertel des Arbeitsspeichers des Docker-Hosts. Für den Import von Deutschland sind 16 GB RAM im Host empfehlenswert.
    default: 2GB
    choices:
      - { value: 1GB, label: 1 GB (Host mit 4–8 GB RAM) }
      - { value: 2GB, label: 2 GB (Host mit 8–16 GB RAM) }
      - { value: 4GB, label: 4 GB (Host mit 16–32 GB RAM) }
      - { value: 8GB, label: 8 GB (Host mit 32 GB RAM oder mehr) }
  port:
    type: int
    label: Port auf dem Host
    default: 8088
    min: 1024
    max: 65535

files:
  volume: scripts
  target: /addon
  paths:
    - scripts/import.sh

containers:
  - name: nominatim
    image: mediagis/nominatim:5.3.2
    shmSize: 1g
    env:
      PBF_URL: "https://download.geofabrik.de/europe/{{options.region}}-latest.osm.pbf"
      REPLICATION_URL: "https://download.geofabrik.de/europe/{{options.region}}-updates/"
      UPDATE_MODE: "{{options.updates}}"
      IMPORT_STYLE: "{{options.importStyle}}"
      POSTGRES_SHARED_BUFFERS: "{{options.memory}}"
      POSTGRES_MAINTENANCE_WORK_MEM: "{{options.memory}}"
      POSTGRES_AUTOVACUUM_WORK_MEM: "{{options.memory}}"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "{{options.memory}}"
    ports:
      - container: 8080
        host: "{{options.port}}"
    volumes:
      - { name: db, target: /var/lib/postgresql/16/main }
    # Ohne fertigen Import würde der Container selbst importieren – das übernimmt der Job mit Fortschrittsanzeige
    waitForJob: import

jobs:
  import:
    label: Suchdaten importieren
    description: OSM-Daten laden und in die Suchdatenbank importieren (einmalig, dauert Stunden).
    runOnInstall: true
    restartAfter: true
    image: mediagis/nominatim:5.3.2
    command: ["bash", "/elvis/addon/scripts/import.sh"]
    shmSize: 2g
    env:
      PBF_URL: "https://download.geofabrik.de/europe/{{options.region}}-latest.osm.pbf"
      REPLICATION_URL: "https://download.geofabrik.de/europe/{{options.region}}-updates/"
      UPDATE_MODE: "{{options.updates}}"
      IMPORT_STYLE: "{{options.importStyle}}"
      POSTGRES_SHARED_BUFFERS: "{{options.memory}}"
      POSTGRES_MAINTENANCE_WORK_MEM: "{{options.memory}}"
      POSTGRES_AUTOVACUUM_WORK_MEM: "{{options.memory}}"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "{{options.memory}}"
    volumes:
      - { name: db, target: /var/lib/postgresql/16/main }
      - { name: scripts, target: /elvis, readOnly: true }
    # Phasen aus dem Ablauf von init.sh (bash -x) und den Meldungen von Nominatim
    progress:
      phases:
        - { match: "Downloading OSM extract", percent: 2, label: OSM-Daten laden }
        - { match: "nominatim import --osm-file", percent: 12, label: OSM-Daten importieren }
        - { match: "[Ss]tarting indexing|[Ii]ndexing boundaries", percent: 40, label: Indizieren }
        - { match: "[Rr]ank 26", percent: 60, label: Straßen indizieren }
        - { match: "[Rr]ank 30", percent: 70, label: Adressen indizieren }
        - { match: "nominatim index --threads", percent: 88, label: Nachindizieren }
        - { match: "check-database", percent: 91, label: Datenbank prüfen }
        - { match: "admin --warm", percent: 94, label: Zwischenspeicher füllen }
        - { match: "ANALYZE", percent: 97, label: Statistik }

provides:
  geocoders:
    - id: nominatim
      name: Ortssuche (lokal)
      type: nominatim
      url: "http://{{host.address}}:{{options.port}}"
